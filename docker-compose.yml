services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      STORAGE_PATH: /data
    volumes:
      # ホスト側のパスを変えるだけでデータ保存先を変更できる（再ビルド不要）
      # 既存の storage フォルダをそのまま使う場合は ./storage:/data に変更する
      # 例: /mnt/nas/image-viewer:/data
      - ./data:/data
    restart: unless-stopped
